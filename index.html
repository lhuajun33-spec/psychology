<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统入口 | Shimano Symposium</title>
    <style>
        :root { --bg: #0d0f14; --card-bg: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.08); --primary: #3b82f6; --text: #f3f4f6; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 0%, #1f2937, var(--bg)); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .container { text-align: center; width: 100%; max-width: 800px; padding: 20px; z-index: 10; }
        h1 { font-size: 3rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; background: linear-gradient(to right, #fff, #9ca3af); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: #9ca3af; font-size: 1.1rem; margin-bottom: 50px; }
        .grid { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; }
        .card { flex: 1; min-width: 250px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; padding: 40px 20px; text-decoration: none; color: var(--text); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; }
        .card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .card .icon { font-size: 3rem; margin-bottom: 20px; }
        .card h2 { margin: 0 0 10px 0; font-size: 1.5rem; font-weight: 600; }
        .card p { margin: 0; color: #6b7280; font-size: 0.95rem; line-height: 1.5; }
        .footer { margin-top: 80px; font-size: 0.8rem; color: rgba(255,255,255,0.2); letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shimano Symposium</h1>
        <p class="subtitle">Interactive Real-time Feedback System</p>
        <div class="grid">
            <a href="screen.html" class="card">
                <div class="icon">🖥️</div>
                <h2>中控大屏端</h2>
                <p>启动全屏弹幕渲染与实时数据统计可视化面板</p>
            </a>
            <a href="client.html" class="card">
                <div class="icon">📱</div>
                <h2>用户答题端</h2>
                <p>扫描二维码进入，参与实时答题并发送互动弹幕</p>
            </a>
        </div>
        <div class="footer">
            BJTU WEIHAI &copy; 2026 RESEARCH PROJECT BY XUE MUQING
        </div>
    </div>
</body>
</html>
