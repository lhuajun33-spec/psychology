<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 赛博中控大屏</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(10, 15, 30, 0.4);
        }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        
        .dashboard { display: grid; grid-template-columns: 300px 1fr 300px; gap: 20px; padding: 30px; height: 100vh; box-sizing: border-box; pointer-events: none; }
        .panel { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 15px; padding: 20px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.1); position: relative; overflow: hidden; pointer-events: auto; }
        .panel::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--neon-blue), transparent); }
        
        h2 { margin-top: 0; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }
        
        /* 倒计时样式 */
        .countdown { font-size: 4rem; font-weight: bold; text-align: center; color: var(--neon-purple); text-shadow: 0 0 20px var(--neon-purple); }
        
        /* 弹幕容器 */
        #danmaku-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; overflow: hidden; }
        .danmaku-item { position: absolute; white-space: nowrap; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px #000; animation: slide linear forwards; }
        @keyframes slide { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }

        /* 布局占位 */
        .left-col { display: flex; flex-direction: column; gap: 20px; }
        .right-col { display: flex; flex-direction: column; gap: 20px; }
        .center-col { display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding-top: 50px;}
        
        .qr-placeholder { width: 100%; height: 200px; background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,243,255,0.1) 10px, rgba(0,243,255,0.1) 20px); border: 2px dashed var(--neon-blue); display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="danmaku-container"></div>

    <div class="dashboard">
        <div class="left-col">
            <div class="panel">
                <h2>System Status</h2>
                <p>Connection: <span style="color:#0f0">Online</span></p>
                <p>Connected Users: <span id="user-count" style="color:var(--neon-blue); font-size: 1.5em;">0</span></p>
                <p>Peer ID: <span id="my-id" style="font-size: 0.8em; color: gray;">Initializing...</span></p>
            </div>
            <div class="panel" style="flex-grow: 1;">
                <h2>Scan to Join</h2>
                <div class="qr-placeholder">QR Code Here</div>
                <p style="text-align: center; margin-top: 10px; font-size: 0.9em; color: #aaa;">扫码进入答题端</p>
            </div>
        </div>

        <div class="center-col">
            <div class="countdown" id="timer">05:00</div>
            <div style="width: 80%; height: 200px; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.3);">扩展内容预留区</div>
        </div>

        <div class="right-col">
            <div class="panel" style="height: 300px;">
                <h2>Live Stats</h2>
                <canvas id="statsChart"></canvas>
            </div>
            <div class="panel" style="flex-grow: 1;">
                <h2>Recent Activity</h2>
                <ul id="activity-log" style="list-style: none; padding: 0; font-size: 0.9em; color: #ccc; line-height: 1.8;">
                    <li>[System] Awaiting connections...</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // === 1. 初始化 Three.js 炫酷 3D 粒子星空 ===
        function init3DBackground() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.001);
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.z = 1000;
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for ( let i = 0; i < 2000; i ++ ) {
                vertices.push( (Math.random() - 0.5) * 2000, (Math.random() - 0.5) * 2000, (Math.random() - 0.5) * 2000 );
            }
            geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( vertices, 3 ) );
            const material = new THREE.PointsMaterial({ color: 0x00f3ff, size: 2, transparent: true, opacity: 0.8 });
            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            function animate() {
                requestAnimationFrame(animate);
                particles.rotation.x += 0.0005;
                particles.rotation.y += 0.001;
                renderer.render(scene, camera);
            }
            animate();
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        }
        init3DBackground();

        // === 2. 初始化 Chart.js 数据图表 ===
        const ctx = document.getElementById('statsChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['A', 'B', 'C', 'D'],
                datasets: [{
                    label: 'Answers',
                    data: [0, 0, 0, 0],
                    backgroundColor: ['rgba(0, 243, 255, 0.6)', 'rgba(188, 19, 254, 0.6)', 'rgba(255, 99, 132, 0.6)', 'rgba(255, 206, 86, 0.6)'],
                    borderColor: ['#00f3ff', '#bc13fe', '#ff6384', '#ffce56'],
                    borderWidth: 1
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#fff' } }, x: { grid: { display: false }, ticks: { color: '#fff' } } }, plugins: { legend: { display: false } } }
        });

        // === 3. 弹幕发射逻辑 ===
        const colors = ['#ffffff', '#00f3ff', '#bc13fe', '#ffff00', '#ff0055'];
        function shootDanmaku(text) {
            const container = document.getElementById('danmaku-container');
            const el = document.createElement('div');
            el.className = 'danmaku-item';
            el.innerText = text;
            el.style.top = Math.random() * 80 + '%';
            el.style.color = colors[Math.floor(Math.random() * colors.length)];
            const duration = Math.random() * 3 + 4; // 4-7秒
            el.style.animationDuration = duration + 's';
            container.appendChild(el);
            setTimeout(() => el.remove(), duration * 1000);
        }

        // === 4. PeerJS 连接与数据处理 ===
        const peer = new Peer('screen-master-888', { debug: 2 }); // 固定大屏ID
        peer.on('open', (id) => { document.getElementById('my-id').innerText = id; });
        
        let connectedUsers = 0;
        peer.on('connection', (conn) => {
            connectedUsers++;
            document.getElementById('user-count').innerText = connectedUsers;
            
            conn.on('data', (data) => {
                if(data.type === 'danmaku') {
                    shootDanmaku(data.content);
                } else if(data.type === 'answer') {
                    // 更新图表
                    const optionIndex = ['A', 'B', 'C', 'D'].indexOf(data.option);
                    if(optionIndex !== -1) {
                        chart.data.datasets[0].data[optionIndex]++;
                        chart.update();
                        
                        // 更新活动日志
                        const log = document.getElementById('activity-log');
                        log.innerHTML = `<li>[Answer] User picked ${data.option}</li>` + log.innerHTML;
                    }
                }
            });
            conn.on('close', () => { connectedUsers--; document.getElementById('user-count').innerText = connectedUsers; });
        });
    </script>
</body>
</html>
