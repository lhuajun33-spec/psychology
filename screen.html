<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Live Dashboard | Shimano</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 MQTT.js 替代原来的 PeerJS -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root { --bg: #050505; --panel: rgba(255,255,255,0.03); --border: rgba(255,255,255,0.08); --primary: #3b82f6; --text: #fff; }
        body, html { margin: 0; padding: 0; background: #000; background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%), radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh; }
        
        .layout { display: grid; grid-template-columns: 350px 1fr 400px; gap: 24px; padding: 32px; height: 100vh; box-sizing: border-box; position: relative; z-index: 10; pointer-events: none; }
        .glass-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 24px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 24px; display: flex; flex-direction: column; pointer-events: auto; }
        
        h3 { font-size: 1.2rem; font-weight: 500; color: #9ca3af; margin: 0 0 20px 0; letter-spacing: 1px; text-transform: uppercase; }
        
        .stat-box { margin-bottom: 20px; }
        .stat-value { font-size: 2.5rem; font-weight: 700; color: #fff; }
        .stat-label { font-size: 0.9rem; color: #6b7280; }

        .timer { font-size: 6rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; background: linear-gradient(to bottom, #fff, #9ca3af); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .center-area { display: flex; flex-direction: column; justify-content: center; align-items: center; }

        /* 弹幕系统 */
        #danmaku-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; overflow: hidden; }
        .danmaku-msg { position: absolute; white-space: nowrap; font-size: 32px; font-weight: 600; color: #fff; text-shadow: 0 4px 12px rgba(0,0,0,0.8); animation: slideLeft linear forwards; }
        @keyframes slideLeft { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
    </style>
</head>
<body>
    <div id="danmaku-layer"></div>

    <div class="layout">
        <div class="glass-panel">
            <h3>System Status</h3>
            <div class="stat-box">
                <div class="stat-label">Connection Protocol</div>
                <div class="stat-value" style="color: #34d399; font-size: 1.5rem; margin-top: 5px;">● MQTT WSS</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Interactions Count</div>
                <div class="stat-value" id="user-count">0</div>
            </div>
            <div class="stat-box" style="margin-top: auto;">
                <div class="stat-label">Active Channel Topic</div>
                <div style="font-family: monospace; color: #9ca3af; margin-top: 5px; font-size: 0.8rem;" id="my-id">Connecting...</div>
            </div>
        </div>

        <div class="center-area">
            <div style="font-size: 1.5rem; color: #6b7280; margin-bottom: -20px;">TIME REMAINING</div>
            <div class="timer">05:00</div>
        </div>

        <div class="glass-panel">
            <h3>Live Responses</h3>
            <div style="flex: 1; position: relative;">
                <canvas id="liveChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 初始化图表
        const ctx = document.getElementById('liveChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Option A', 'Option B', 'Option C', 'Option D'],
                datasets: [{
                    data: [0, 0, 0, 0],
                    backgroundColor: ['rgba(59, 130, 246, 0.8)', 'rgba(139, 92, 246, 0.8)', 'rgba(236, 72, 153, 0.8)', 'rgba(16, 185, 129, 0.8)'],
                    borderRadius: 8,
                    borderSkipped: false
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#9ca3af', stepSize: 1 } }, x: { grid: { display: false }, ticks: { color: '#9ca3af', font: { size: 14 } } } } }
        });

        // 弹幕动画函数
        function fireDanmaku(text) {
            const el = document.createElement('div');
            el.className = 'danmaku-msg';
            el.innerText = text;
            el.style.top = (Math.random() * 70 + 10) + '%'; 
            const duration = Math.random() * 3 + 5; 
            el.style.animationDuration = duration + 's';
            document.getElementById('danmaku-layer').appendChild(el);
            setTimeout(() => el.remove(), duration * 1000);
        }

        // --- 核心：MQTT 云端通信逻辑 ---
        const TOPIC = 'bjtu/shimano/room_888_xm'; // 设定专属频道
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt'); // 使用加密的 WSS 协议
        
        let interactions = 0;

        client.on('connect', () => {
            console.log('✅ 大屏已连接到 MQTT 服务器');
            document.getElementById('my-id').innerText = TOPIC;
            client.subscribe(TOPIC); // 订阅频道，等待接收手机发来的消息
        });

        client.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                interactions++;
                document.getElementById('user-count').innerText = interactions;

                if(data.type === 'danmaku') {
                    fireDanmaku(data.content);
                } 
                else if(data.type === 'answer') {
                    const idx = ['A', 'B', 'C', 'D'].indexOf(data.option);
                    if(idx !== -1) { 
                        chart.data.datasets[0].data[idx]++; 
                        chart.update(); 
                    }
                }
            } catch (e) {
                console.error("数据解析失败", e);
            }
        });
    </script>
</body>
</html>
