<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互动答题器</title>
    <!-- 引入 MQTT.js 与撒花特效 -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #111827; --card: #1f2937; --text: #f9fafb; --primary: #3b82f6; --primary-hover: #2563eb; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        
        .header { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .status { display: flex; align-items: center; font-size: 0.85rem; color: #9ca3af; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; margin-right: 8px; }
        .dot.online { background: #10b981; box-shadow: 0 0 8px #10b981;}

        .main-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        
        .question-container { background: var(--card); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: all 0.3s ease; }
        .progress { font-size: 0.85rem; color: #9ca3af; margin-bottom: 12px; font-weight: 600; }
        .q-title { font-size: 1.25rem; font-weight: 600; line-height: 1.5; margin-bottom: 24px; }
        
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .opt-btn { background: rgba(255,255,255,0.05); border: 2px solid transparent; color: var(--text); padding: 16px; border-radius: 14px; font-size: 1rem; text-align: left; transition: all 0.2s; outline: none; }
        .opt-btn:active { transform: scale(0.98); }
        .opt-btn.active { background: rgba(59, 130, 246, 0.1); border-color: var(--primary); }

        .submit-btn { margin-top: 30px; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 14px; font-size: 1.1rem; font-weight: 600; transition: 0.2s; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); opacity: 0.5; pointer-events: none; }
        .submit-btn.ready { opacity: 1; pointer-events: auto; }
        .submit-btn.ready:active { background: var(--primary-hover); transform: scale(0.98); }

        .bottom-bar { background: var(--card); padding: 12px 20px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
        .dm-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px 16px; border-radius: 20px; font-size: 1rem; outline: none; transition: 0.2s; }
        .dm-input:focus { border-color: var(--primary); }
        .send-btn { background: transparent; color: var(--primary); border: none; font-weight: 600; font-size: 1rem; padding: 0 10px; }

        #done-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
        #done-screen h2 { font-size: 2rem; margin-bottom: 10px; }
        #done-screen p { color: #9ca3af; }
    </style>
</head>
<body>
    <div class="header">
        <div style="font-weight: 700; letter-spacing: 1px;">SHIMANO</div>
        <div class="status"><div class="dot" id="dot"></div><span id="status-text">Connecting</span></div>
    </div>

    <div class="main-content">
        <div class="question-container" id="q-card">
            <div class="progress" id="q-progress">Question 1 of 3</div>
            <div class="q-title" id="q-title">正在加载题目...</div>
            <div class="options-list" id="opt-container"></div>
            <button class="submit-btn" id="submit-btn" onclick="submitAnswer()">确认提交</button>
        </div>

        <div id="done-screen">
            <h2>🎉 答题完成</h2>
            <p>感谢您的参与！请看大屏幕统计结果。</p>
        </div>
    </div>

    <div class="bottom-bar">
        <input type="text" id="dm-input" class="dm-input" placeholder="输入弹幕参与讨论...">
        <button class="send-btn" onclick="sendDM()">发送</button>
    </div>

    <script>
        // 渲染题目逻辑
        const questions = [
            { id: 1, title: "本次 Shimano 研讨会项目中，企业的核心转型方向是？", options: [{val: 'A', text: "A. 纯硬件制造"}, {val: 'B', text: "B. 数字化与生态构建"}, {val: 'C', text: "C. 放弃自行车业务"}, {val: 'D', text: "D. 降价促销策略"}] },
            { id: 2, title: "在 Shimano 产品生态圈构建中，哪项平台技术起到了关键的数据链接作用？", options: [{val: 'A', text: "A. E-TUBE 平台"}, {val: 'B', text: "B. 传统机械变速研发"}, {val: 'C', text: "C. 碳纤维成型技术"}, {val: 'D', text: "D. 气动风洞测试"}] },
            { id: 3, title: "未来智慧出行的主要商业模式，以下哪项不在 Shimano 的重点布局中？", options: [{val: 'A', text: "A. 硬件一次性买卖"}, {val: 'B', text: "B. 骑行数据追踪"}, {val: 'C', text: "C. 智能零配件维保"}, {val: 'D', text: "D. 纯外卖配送服务"}] }
        ];

        let currentIndex = 0;
        let selectedOption = null;

        function renderQuestion() {
            if (currentIndex >= questions.length) {
                document.getElementById('q-card').style.display = 'none';
                document.getElementById('done-screen').style.display = 'flex';
                return;
            }
            const q = questions[currentIndex];
            document.getElementById('q-progress').innerText = `Question ${currentIndex + 1} of ${questions.length}`;
            document.getElementById('q-title').innerText = q.title;
            
            const container = document.getElementById('opt-container');
            container.innerHTML = ''; 
            selectedOption = null;
            document.getElementById('submit-btn').classList.remove('ready');

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt.text;
                btn.onclick = () => {
                    document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedOption = opt.val;
                    document.getElementById('submit-btn').classList.add('ready');
                };
                container.appendChild(btn);
            });
        }
        renderQuestion();

        // --- 核心：MQTT 云端通信逻辑 ---
        const TOPIC = 'bjtu/shimano/room_888_xm'; // 必须和大屏保持完全一致
        const mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt'); // 使用加密端口

        mqttClient.on('connect', () => {
            console.log("✅ 手机端已连接云服务器");
            document.getElementById('dot').classList.add('online');
            document.getElementById('status-text').innerText = 'Connected';
            // 发送一条连接提示给大屏，增加互动计数
            mqttClient.publish(TOPIC, JSON.stringify({ type: 'join' }));
        });

        // 提交答案
        function submitAnswer() {
            if(selectedOption && mqttClient.connected) {
                const payload = JSON.stringify({ type: 'answer', option: selectedOption, qId: questions[currentIndex].id });
                mqttClient.publish(TOPIC, payload); // 直接发布到频道
                
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#3b82f6', '#10b981', '#ffffff'] });
                
                setTimeout(() => {
                    currentIndex++;
                    renderQuestion();
                }, 800);
            }
        }

        // 发送弹幕
        function sendDM() {
            const input = document.getElementById('dm-input');
            const val = input.value.trim();
            if(val && mqttClient.connected) { 
                const payload = JSON.stringify({ type: 'danmaku', content: val });
                mqttClient.publish(TOPIC, payload); 
                input.value = ''; 
            }
        }
    </script>
</body>
</html>
